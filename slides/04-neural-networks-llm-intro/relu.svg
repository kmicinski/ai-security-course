<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 235" width="360" height="235" font-family="Helvetica, Arial, sans-serif">
  <!-- axes -->
  <line x1="40" y1="190" x2="310" y2="190" stroke="#999" stroke-width="1"/>
  <line x1="170" y1="200" x2="170" y2="25"  stroke="#999" stroke-width="1"/>
  <!-- x ticks -->
  <g fill="#555" font-size="9" text-anchor="middle">
    <line x1="40"  y1="190" x2="40"  y2="194" stroke="#999"/><text x="40"  y="204">-4</text>
    <line x1="105" y1="190" x2="105" y2="194" stroke="#999"/><text x="105" y="204">-2</text>
    <text x="176" y="204" text-anchor="start">0</text>
    <line x1="235" y1="190" x2="235" y2="194" stroke="#999"/><text x="235" y="204">2</text>
    <line x1="300" y1="190" x2="300" y2="194" stroke="#999"/><text x="300" y="204">4</text>
  </g>
  <!-- y ticks -->
  <g fill="#555" font-size="9" text-anchor="end">
    <line x1="166" y1="150" x2="170" y2="150" stroke="#999"/><text x="163" y="153">1</text>
    <line x1="166" y1="110" x2="170" y2="110" stroke="#999"/><text x="163" y="113">2</text>
    <line x1="166" y1="70"  x2="170" y2="70"  stroke="#999"/><text x="163" y="73">3</text>
    <line x1="166" y1="30"  x2="170" y2="30"  stroke="#999"/><text x="163" y="33">4</text>
  </g>
  <!-- the function -->
  <polyline points="40,190 170,190 300,30" fill="none" stroke="#F76900" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="170" cy="190" r="3" fill="#F76900"/>
  <!-- annotations -->
  <text x="46"  y="178" fill="#555" font-size="9">gradient 0 &#8212; unit is "dead"</text>
  <text x="196" y="92"  fill="#555" font-size="9">gradient 1, never saturates</text>
  <text x="150" y="222" fill="#333" font-size="10" text-anchor="middle">score  z = w&#8868;x + b</text>
  <text x="14"  y="110" fill="#333" font-size="10" text-anchor="middle" transform="rotate(-90 14 110)">ReLU(z)</text>
</svg>
