<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CIS 400 — Cybersecurity and AI">
  <title>CIS 400 / 600 — Cybersecurity &amp; AI</title>
  <!-- Syracuse Navy tile so the mark reads on light and dark browser bars -->
  <rect width="64" height="64" rx="14" fill="#000E54"/>
  <!-- Security: a shield in Syracuse Orange -->
  <path d="M32 12 L50 17.5 Q50 40 32 52 Q14 40 14 17.5 Z" fill="#F76900"/>
  <!-- AI: a small node graph carried by the shield -->
  <g stroke="#000E54" stroke-width="2.4" stroke-linecap="round">
    <line x1="32" y1="24.5" x2="24" y2="38"/>
    <line x1="32" y1="24.5" x2="40" y2="38"/>
    <line x1="24" y1="38"   x2="40" y2="38"/>
  </g>
  <circle cx="24" cy="38"   r="3.6" fill="#000E54"/>
  <circle cx="40" cy="38"   r="3.6" fill="#000E54"/>
  <circle cx="32" cy="24.5" r="4.4" fill="#0AA6B7" stroke="#000E54" stroke-width="1.6"/>
</svg>
